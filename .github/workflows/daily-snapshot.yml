name: Snapshot alla chiusura

on:
  schedule:
    # 22:30 UTC, lunedì-venerdì: dopo le 16:00 di New York sia con l'ora solare sia con l'ora legale.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Scarica STLFSI4 e l'HICP euro se la chiave c'è
        run: python mobile/scripts/fetch_fred_series.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Ricalcola lo snapshot
        run: python mobile/scripts/update_daily.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      - name: Pubblica data/snapshot.json
        run: |
          git config user.email "snapshot-bot@users.noreply.github.com"
          git config user.name "snapshot-bot"
          git add data/snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna lo snapshot alla chiusura"
          git push
